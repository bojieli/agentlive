# Publish through a Cloudflare Tunnel instead of an inbound port.
#
#   AGENTLIVE_PUBLIC_ORIGIN=https://name.example.com \
#   CLOUDFLARE_TUNNEL_TOKEN=... \
#   docker compose -p agentlive -f compose.yaml -f deployment/compose.cloudflared.yaml up -d
#
# cloudflared dials out, so no inbound port is opened and nothing already
# listening on 80 or 443 is disturbed. Cloudflare terminates TLS at its edge,
# which means it can see recording content and access keys in clear: read the
# trade-off in deployment/README.md before using this for private sessions.
services:
  agentlive:
    # The viewer checks the browser's Origin against the origin the server
    # believes it serves; behind the tunnel that is the public name, not the
    # container's address.
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "7331"
      - --state-dir
      - /data
      - --public-origin
      - ${AGENTLIVE_PUBLIC_ORIGIN:?set the public https origin, e.g. https://agentlive.example.com}
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      # A tunnel token authorizes running this one tunnel, nothing else.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?create the tunnel in the Cloudflare dashboard and paste its token}
    depends_on:
      agentlive:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
